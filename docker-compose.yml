services:
  laravel:
    container_name: termy-laravel
    build:
      context: ./laravel/vendor/laravel/sail/runtimes/8.3
      dockerfile: Dockerfile
      args:
        WWWGROUP: 1111
    image: sail-8.3/app
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${LARAVEL_PORT:-80}:80'
      - '${LARAVEL_WS_PORT:-8765}:8765'
    environment:
      WWWUSER: 1000
      LARAVEL_SAIL: 1
      XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
      XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
      IGNITION_LOCAL_SITES_PATH: '${PWD}'
    volumes:
      - './laravel:/var/www/html:z'
    networks:
      - sail
    depends_on:
      - mysql

  mysql:
    container_name: termy-mysql
    image: 'mysql/mysql-server:8.0'
    ports:
      - '${FORWARD_DB_PORT:-3306}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_USER: '${DB_USERNAME}'
      MYSQL_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
    volumes:
      - 'sail-mysql:/var/lib/mysql'
      - './laravel/vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
    networks:
      - sail
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - '-p${DB_PASSWORD}'
      retries: 3
      timeout: 5s

  go-server:
    container_name: termy-go
    build:
      context: ./ssh-server
      dockerfile: ./dockerfiles/Dockerfile.dev
    ports:
      - "${SSH_PROXY_PORT:-8080}:8080"
    volumes:
      - ./ssh-server:/app
    networks:
      - sail


networks:
  sail:
    driver: bridge

volumes:
  sail-mysql:
    driver: local
